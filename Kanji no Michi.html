<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字の道 — JLPT N3 Kanji Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="waves"></div>
<div id="app"></div>

<script src="data.js"></script>
<script src="sql-wasm.js"></script>
<script>
(function(){
  "use strict";

  /* ---------------- DATA ---------------- */
  /* Data loaded from data.js and persisted through local SQL */
  const DB_KEY = "kanji_no_michi_sqlite";
  /* Bump this whenever the bundled word list in data.js changes, so existing
     local databases pick up the new seed. Words the user added themselves
     (source = 'user') survive re-seeding. */
  const SEED_VERSION = "somatome-n3-daily-v1";
  let sqlDb = null;

  function persistSqlDatabase() {
    if (!sqlDb) return;
    const data = sqlDb.export();
    const binary = Array.from(data).map(byte => String.fromCharCode(byte)).join("");
    localStorage.setItem(DB_KEY, btoa(binary));
  }

  function loadCategoriesFromDb() {
    if (!sqlDb) return;
    const result = sqlDb.exec(`
      SELECT cat_id, kanji, hiragana, meaning FROM words
      ORDER BY CASE source WHEN 'seed' THEN 0 ELSE 1 END, id
    `);
    const rows = result[0] ? result[0].values : [];
    const freshCategories = CATEGORIES.map(cat => ({ ...cat, words: [] }));

    rows.forEach(([catId, kanji, hiragana, meaning]) => {
      const cat = freshCategories.find(item => item.id === catId);
      if (cat) {
        cat.words.push({ k: kanji, h: hiragana, m: meaning });
      }
    });

    CATEGORIES.splice(0, CATEGORIES.length, ...freshCategories);
  }

  async function initSqlDatabase() {
    if (!window.initSqlJs) {
      throw new Error("SQL.js failed to load.");
    }

    const SQL = await window.initSqlJs({
      locateFile: file => `./${file}`
    });

    const stored = localStorage.getItem(DB_KEY);
    if (stored) {
      try {
        const binary = atob(stored);
        const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
        sqlDb = new SQL.Database(bytes);
      } catch (error) {
        console.warn("Could not restore SQL database from localStorage. Starting fresh.", error);
        sqlDb = new SQL.Database();
      }
    } else {
      sqlDb = new SQL.Database();
    }

    sqlDb.run(`
      CREATE TABLE IF NOT EXISTS words (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        cat_id TEXT NOT NULL,
        kanji TEXT NOT NULL,
        hiragana TEXT NOT NULL,
        meaning TEXT NOT NULL,
        source TEXT NOT NULL DEFAULT 'seed'
      )
    `);

    sqlDb.run(`
      CREATE TABLE IF NOT EXISTS meta (
        key TEXT PRIMARY KEY,
        value TEXT NOT NULL
      )
    `);

    const storedVersion =
      sqlDb.exec(`SELECT value FROM meta WHERE key = 'seed_version'`)[0]?.values?.[0]?.[0] || null;

    if (storedVersion !== SEED_VERSION) {
      seedWords();
      sqlDb.run(`INSERT OR REPLACE INTO meta (key, value) VALUES ('seed_version', ?)`, [SEED_VERSION]);
      persistSqlDatabase();
    }

    loadCategoriesFromDb();
  }

  /* Reloads the bundled word list, leaving the user's own additions in place. */
  function seedWords() {
    sqlDb.run(`DELETE FROM words WHERE source = 'seed'`);

    const insertStmt = sqlDb.prepare(`
      INSERT INTO words (cat_id, kanji, hiragana, meaning, source)
      VALUES (?, ?, ?, ?, ?)
    `);

    CATEGORIES.forEach(cat => {
      cat.words.forEach(word => {
        insertStmt.run([cat.id, word.k, word.h, word.m, "seed"]);
      });
    });

    insertStmt.free();
  }

  function addKanjiToCategory(catId, kanji, hiragana, meaning) {
    const cat = byId(catId);
    if (!cat || !sqlDb) return false;

    const stmt = sqlDb.prepare(`
      INSERT INTO words (cat_id, kanji, hiragana, meaning, source)
      VALUES (?, ?, ?, ?, ?)
    `);
    stmt.run([catId, kanji, hiragana, meaning, "user"]);
    stmt.free();
    persistSqlDatabase();
    loadCategoriesFromDb();
    return true;
  }

  async function bootApp() {
    try {
      await initSqlDatabase();
      render();
    } catch (error) {
      console.error("Failed to initialize SQL database:", error);
      alert("The local database could not be loaded. Please refresh the page.");
    }
  }

  /* ---------------- STATE (per flashcard session) ---------------- */
  let flashState = { catId:null, order:[], index:0, flipped:false };

  const totalWords = () => CATEGORIES.reduce((sum, cat) => sum + cat.words.length, 0);

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function startFlash(catId, doShuffle){
    const cat = byId(catId);
    const idxs = cat.words.map((_,i)=>i);
    flashState = { catId, order: doShuffle ? shuffle(idxs) : idxs, index:0, flipped:false };
  }

  /* ---------------- ROUTER ---------------- */
  function parseHash(){
    const h = location.hash.replace(/^#\/?/, "");
    const parts = h.split("/").filter(Boolean);
    return parts;
  }

  function navigate(hash){
    location.hash = hash;
  }

  window.addEventListener("hashchange", () => {
    if (sqlDb) render();
  });
  window.addEventListener("DOMContentLoaded", bootApp);

  /* ---------------- ICONS ---------------- */
  const ICON_ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  /* ---------------- LEAVES + SCENE (landing only) ---------------- */
  const LEAF_SVG = '<svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 2 C 8 8 4 18 16 30 C 28 18 24 8 16 2 Z"/><path d="M16 6 L16 26 M16 13 L11 9 M16 18 L21 22" stroke="rgba(0,0,0,0.28)" stroke-width="1.3" fill="none"/></svg>';

  const LEAF_CONFIG = [
    {left:4,  delay:0,   dur:11,   drift:40,  size:17, tone:"a"},
    {left:14, delay:2.5, dur:9,    drift:-30, size:20, tone:"b"},
    {left:23, delay:5,   dur:13,   drift:50,  size:14, tone:"c"},
    {left:33, delay:1,   dur:10,   drift:-45, size:18, tone:"a"},
    {left:44, delay:4,   dur:12,   drift:35,  size:16, tone:"b"},
    {left:55, delay:6.5, dur:9.5,  drift:-25, size:20, tone:"c"},
    {left:65, delay:2,   dur:11.5, drift:40,  size:15, tone:"a"},
    {left:74, delay:8,   dur:10,   drift:-35, size:18, tone:"b"},
    {left:83, delay:3.5, dur:13.5, drift:30,  size:16, tone:"c"},
    {left:91, delay:7,   dur:9,    drift:-40, size:19, tone:"a"},
    {left:9,  delay:9.5, dur:12.5, drift:25,  size:14, tone:"b"},
    {left:60, delay:0.8, dur:10.5, drift:-30, size:17, tone:"c"},
  ];

  function renderLeaves(){
    const leaves = LEAF_CONFIG.map(cfg => `
      <div class="leaf tone-${cfg.tone}" style="--left:${cfg.left}%; --delay:${cfg.delay}s; --dur:${cfg.dur}s; --drift:${cfg.drift}px; --size:${cfg.size}px;">
        ${LEAF_SVG}
      </div>`).join("");
    return `<div class="leaves" aria-hidden="true">${leaves}</div>`;
  }

  function renderHeroScene(){
    return `
      <div class="hero-scene" aria-hidden="true">
        <svg viewBox="0 0 800 260" preserveAspectRatio="xMidYMax slice">
          <defs>
            <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
              <!-- warmer sunrise palette -->
              <stop offset="0%" stop-color="#3B1E2B"/>
              <stop offset="38%" stop-color="#7C3A39"/>
              <stop offset="65%" stop-color="#C1633B"/>
              <stop offset="100%" stop-color="#F6B258"/>
            </linearGradient>
            <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FCEAC0" stop-opacity="0.9"/>
              <stop offset="60%" stop-color="#F0964B" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#F0964B" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect x="0" y="0" width="800" height="260" fill="url(#skyGrad)"/>
          <circle cx="400" cy="95" r="90" fill="url(#sunGlow)"/>
          <circle cx="400" cy="95" r="42" fill="var(--sun)"/>
          <path d="M150,230 L300,90 L340,120 L400,50 L460,120 L500,90 L650,230 Z" fill="var(--fuji)" opacity="0.92"/>
          <path d="M400,50 L424,84 L408,80 L400,96 L392,80 L376,84 Z" fill="var(--fuji-snow)" opacity="0.9"/>
          <rect x="0" y="222" width="800" height="38" fill="#141C2B"/>
          <rect x="372" y="150" width="13" height="80" fill="#8C2E1E"/>
          <rect x="415" y="150" width="13" height="80" fill="#8C2E1E"/>
          <rect x="358" y="140" width="84" height="11" rx="2" fill="var(--shu)"/>
          <rect x="365" y="156" width="70" height="9" rx="2" fill="#8C2E1E"/>
          <rect x="378" y="182" width="44" height="7" fill="#6E2417"/>
        </svg>
      </div>`;
  }

  /* ---------------- RENDER ---------------- */
  function render(){
    const parts = parseHash();
    const app = document.getElementById("app");

    if(parts.length === 0){
      app.innerHTML = renderLanding();
      bindLanding();
      return;
    }
    if(parts[0] === "vocabulary"){
      app.innerHTML = renderVocabPlaceholder();
      bindTopNav();
      return;
    }
    if(parts[0] === "kanji"){
      if(parts.length === 1){
        app.innerHTML = renderWeekGrid();
        bindTopNav();
        bindCardGrid("data-week");
        return;
      }

      const week = weekById(parts[1]);
      if(!week){ navigate("kanji"); return; }

      if(parts.length === 2){
        app.innerHTML = renderDayGrid(week);
        bindTopNav();
        bindCardGrid("data-day");
        return;
      }

      const cat = byId(week.id + parts[2]);
      if(!cat){ navigate(`kanji/${week.id}`); return; }

      const mode = parts[3] === "cards" ? "cards" : "list";
      if(mode === "cards" && cat.words.length > 0){
        startFlash(cat.id, true);
      }
      app.innerHTML = renderCategoryDetail(week, cat, mode);
      bindTopNav();
      bindCategoryDetail(week, cat, mode);
      return;
    }
    navigate("");
  }

  /* ---- topbar / breadcrumb shared ---- */
  function topbar(crumbHtml){
    return `
      <div class="topbar wrap">
        <a class="brand" href="#/" data-nav="">
          <span class="stamp-mini">道</span>
          漢字の道
        </a>
        <div class="breadcrumb">${crumbHtml}</div>
      </div>`;
  }

  function bindTopNav(){
    document.querySelectorAll("[data-nav]").forEach(el=>{
      el.addEventListener("click", e=>{
        e.preventDefault();
        navigate(el.getAttribute("data-nav"));
      });
    });
  }

  /* ---------------- LANDING ---------------- */
  function renderLanding(){
    return `
      <div class="content">
        ${renderLeaves()}
        ${topbar(`<span class="current">はじめに</span>`)}
        <div class="landing-hero wrap">
          <div class="enso-wrap" aria-hidden="true">
            <svg viewBox="0 0 200 200">
              <path class="enso-path" d="M100,20 C 150,22 178,60 176,102 C 174,146 138,180 96,178 C 54,176 22,142 24,98 C 26,58 56,26 96,22" />
            </svg>
          </div>
          <div class="hero-inner">
            <span class="eyebrow">Learn at your own pace</span>
            <h1 class="hero-title">漢字の道</h1>
            <span class="level-tag">JLPT N3 level</span>
            <p class="hero-sub">Kanji no Michi — "the way of kanji." Built for JLPT N3 study: work through characters and words in small, focused sets, one card at a time.</p>
          </div>
          ${renderHeroScene()}
        </div>

        <div class="choice-row wrap">
          <a class="choice-card" href="#/kanji" data-nav="kanji" tabindex="0">
            <span class="ghost-kanji">漢</span>
            <span class="kanji-big">漢字</span>
            <span class="en-label">Kanji</span>
            <span class="desc">Six weeks of daily sets — ${totalWords()} words, seven days at a time.</span>
            <span class="go">Begin ${ICON_ARROW}</span>
          </a>
          <a class="choice-card" href="#/vocabulary" data-nav="vocabulary" tabindex="0">
            <span class="ghost-kanji">語</span>
            <span class="kanji-big">単語</span>
            <span class="en-label">Vocabulary</span>
            <span class="desc">Broader word sets beyond single kanji — phrases, expressions and usage.</span>
            <span class="go">Begin ${ICON_ARROW}</span>
          </a>
        </div>

        <div class="landing-footer">静かに、一歩ずつ — quietly, one step at a time</div>
      </div>`;
  }

  function bindLanding(){
    bindTopNav();
  }

  /* ---------------- VOCAB PLACEHOLDER ---------------- */
  function renderVocabPlaceholder(){
    return `
      <div class="content">
        ${topbar(`<button data-nav="" >漢字の道</button><span class="sep">/</span><span class="current">単語</span>`)}
        <div class="empty-state">
          <div class="glyph">語</div>
          <h2>Vocabulary is on its way</h2>
          <p>This section will hold broader vocabulary sets. For now, head into the Kanji section to start studying.</p>
          <div style="margin-top:24px;">
            <a href="#/kanji" data-nav="kanji" class="choice-card" style="display:inline-block; width:auto; padding:12px 22px;">
              <span class="go" style="position:static;">Go to Kanji ${ICON_ARROW}</span>
            </a>
          </div>
        </div>
      </div>`;
  }

  /* ---------------- WEEK GRID ---------------- */
  function renderWeekGrid(){
    const cards = WEEKS.map(w=>{
      const disabled = w.wordCount === 0;
      return `
        <div class="cat-card ${disabled ? "disabled" : "active-card"}" ${disabled ? "" : `data-week="${w.id}" tabindex="0" role="button"`}>
          <span class="ghost-kanji">${w.glyph}</span>
          <div>
            <div class="cat-jp">${w.jp}</div>
            <div class="cat-en">${w.en}</div>
            <div class="cat-sub">${w.days.length} day${w.days.length===1?"":"s"} of study</div>
          </div>
          <div class="cat-meta">
            <span class="count-badge ${disabled ? "empty" : ""}">${disabled ? "Coming soon" : w.wordCount + " words"}</span>
            ${disabled ? "" : `<span class="arrow-hint">${ICON_ARROW}</span>`}
          </div>
        </div>`;
    }).join("");

    return `
      <div class="content">
        ${topbar(`<button data-nav="">漢字の道</button><span class="sep">/</span><span class="current">漢字</span>`)}
        <div class="section-header wrap">
          <h1>Choose a week</h1>
          <p>The course runs for six weeks, seven days at a time. Pick a week to see its days.</p>
        </div>
        <div class="cat-grid wrap">${cards}</div>
      </div>`;
  }

  /* ---------------- DAY GRID ---------------- */
  function renderDayGrid(week){
    const cards = week.days.map(d=>{
      const disabled = d.words.length === 0;
      return `
        <div class="cat-card ${disabled ? "disabled" : "active-card"}" ${disabled ? "" : `data-day="${d.route}" tabindex="0" role="button"`}>
          <span class="ghost-kanji">${d.glyph}</span>
          <div>
            <div class="cat-jp">${d.jp}</div>
            <div class="cat-en">${d.en}</div>
            <div class="cat-sub kanji-peek">${kanjiPeek(d)}</div>
          </div>
          <div class="cat-meta">
            <span class="count-badge ${disabled ? "empty" : ""}">${disabled ? "No words yet" : d.words.length + " words"}</span>
            ${disabled ? "" : `<span class="arrow-hint">${ICON_ARROW}</span>`}
          </div>
        </div>`;
    }).join("");

    const crumb = `
      <button data-nav="">漢字の道</button><span class="sep">/</span>
      <button data-nav="kanji">漢字</button><span class="sep">/</span>
      <span class="current">${week.jp}</span>`;

    return `
      <div class="content">
        ${topbar(crumb)}
        <div class="section-header wrap">
          <div class="section-jp">${week.jp}</div>
          <h1>${week.en}</h1>
          <p>${week.wordCount} words spread over ${week.days.length} days. Pick a day to study it as a list or with flashcards.</p>
        </div>
        <div class="cat-grid wrap">${cards}</div>
      </div>`;
  }

  /* The first handful of distinct kanji in a set — a glance at what it covers. */
  function kanjiPeek(cat){
    const CJK = /[一-鿿]/;
    const seen = [];
    for(const w of cat.words){
      for(const ch of w.k){
        if(CJK.test(ch) && !seen.includes(ch)) seen.push(ch);
      }
      if(seen.length >= 7) break;
    }
    return seen.slice(0,7).join("・");
  }

  /* Cards in a grid carry their destination in a data attribute. */
  function bindCardGrid(attr){
    document.querySelectorAll(`.cat-card[${attr}]`).forEach(el=>{
      const go = ()=> navigate(`kanji/${el.getAttribute(attr)}`);
      el.addEventListener("click", go);
      el.addEventListener("keydown", e=>{ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); go(); }});
    });
  }

  /* ---------------- DAY DETAIL ---------------- */
  function renderCategoryDetail(week, cat, mode){
    const crumb = `
      <button data-nav="">漢字の道</button><span class="sep">/</span>
      <button data-nav="kanji">漢字</button><span class="sep">/</span>
      <button data-nav="kanji/${week.id}">${week.jp}</button><span class="sep">/</span>
      <span class="current">${cat.jp}</span>`;

    const header = `
      <div class="detail-header wrap">
        <div class="cat-jp-big">${cat.jp}</div>
        <h1>${week.en} · ${cat.en}</h1>
        <div class="count-line">${cat.words.length} word${cat.words.length===1?"":"s"} in this set</div>
      </div>`;

    if(cat.words.length === 0){
      return `
        <div class="content">
          ${topbar(crumb)}
          ${header}
          <div class="empty-state">
            <div class="glyph">${cat.glyph}</div>
            <h2>No words yet</h2>
            <p>This day is empty for now. Try another day in the meantime.</p>
          </div>
        </div>`;
    }

    const toggle = `
      <div class="mode-toggle">
        <button data-mode="list" class="${mode==="list"?"active":""}">List</button>
        <button data-mode="cards" class="${mode==="cards"?"active":""}">Flashcards</button>
        <button type="button" class="add-btn" id="openAddModalBtn" aria-label="Add your own kanji">＋</button>
      </div>`;

    const addModal = `
      <div class="add-kanji-overlay" id="addKanjiOverlay" aria-hidden="true">
        <div class="add-kanji-backdrop" id="addKanjiBackdrop"></div>
        <div class="add-kanji-modal" role="dialog" aria-modal="true" aria-labelledby="add-kanji-title">
          <div class="modal-header">
            <h3 id="add-kanji-title">Add your own kanji</h3>
            <button type="button" class="modal-close" id="closeAddModalBtn" aria-label="Close">×</button>
          </div>
          <div class="modal-field">
            <label for="addKanji">Kanji</label>
            <input type="text" id="addKanji" placeholder="例: 旅" maxlength="10">
          </div>
          <div class="modal-field">
            <label for="addHira">Hiragana</label>
            <input type="text" id="addHira" placeholder="たび" maxlength="20">
          </div>
          <div class="modal-field">
            <label for="addMeaning">English meaning</label>
            <input type="text" id="addMeaning" placeholder="journey; trip" maxlength="50">
          </div>
          <div class="modal-actions">
            <button type="button" class="secondary-btn" id="cancelAddModalBtn">Cancel</button>
            <button type="button" class="primary-btn" id="submitKanji">Add</button>
          </div>
        </div>
      </div>`;

    const body = mode === "list" ? renderListView(cat) : renderFlashView(cat);

    return `
      <div class="content">
        ${topbar(crumb)}
        ${header}
        ${toggle}
        ${body}
        ${addModal}
      </div>`;
  }

  function renderListView(cat){
    const rows = cat.words.map((w,i)=>`
      <div class="row">
        <div class="k">${w.k}</div>
        <div class="mid">
          <div class="hira">${w.h}</div>
          <div class="meaning">${w.m}</div>
        </div>
        <div class="idx">${String(i+1).padStart(2,"0")}</div>
      </div>`).join("");
    return `<div class="kanji-list wrap">${rows}</div>`;
  }

  function renderFlashView(cat){
    if(flashState.catId !== cat.id || !flashState.order || flashState.order.length !== cat.words.length){
      startFlash(cat.id, true);
    }
    const total = flashState.order.length;
    const pos = flashState.index;
    const word = cat.words[flashState.order[pos]];

    return `
      <div class="flash-stage wrap">
        <div class="flash-controls-top">
          <span class="counter-pill">${pos+1} / ${total}</span>
          <button class="icon-btn" id="shuffleBtn" title="Shuffle" aria-label="Shuffle cards">⤨</button>
          <button class="icon-btn" id="resetBtn" title="Reset order" aria-label="Reset order">↺</button>
        </div>

        <div class="flip-card ${flashState.flipped ? "flipped":""}" id="flipCard">
          <div class="flip-card-inner">
            <div class="face face-front">
              <div class="kbig">${word.k}</div>
              <div class="hint">Tap to reveal</div>
            </div>
            <div class="face face-back">
              <div class="hira-big">${word.h}</div>
              <div class="meaning-line">(${word.m})
                <span class="kanji-mini">${word.k}</span>
              </div>
            </div>
          </div>
        </div>

        <div class="flash-nav">
          <button class="nav-btn" id="prevBtn" ${pos===0?"disabled":""} aria-label="Previous card">‹</button>
          <button class="nav-btn" id="nextBtn" ${pos===total-1?"disabled":""} aria-label="Next card">›</button>
        </div>
      </div>`;
  }

  function bindCategoryDetail(week, cat, mode){
    document.querySelectorAll(".mode-toggle button[data-mode]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const m = btn.getAttribute("data-mode");
        const target = `kanji/${cat.route}/${m}`;
        const current = parseHash().join("/");
        if(current === target){
          if(m === "cards" && cat.words.length > 0) startFlash(cat.id, true);
          rerenderDetail(week, cat, m);
        } else {
          navigate(target);
        }
      });
    });

    const openModalBtn = document.getElementById("openAddModalBtn");
    const addModal = document.getElementById("addKanjiOverlay");
    const backdrop = document.getElementById("addKanjiBackdrop");
    const closeModalBtn = document.getElementById("closeAddModalBtn");
    const cancelModalBtn = document.getElementById("cancelAddModalBtn");
    const submitBtn = document.getElementById("submitKanji");

    function openAddModal(){
      if(!addModal) return;
      addModal.classList.add("visible");
      addModal.setAttribute("aria-hidden", "false");
      const input = document.getElementById("addKanji");
      if(input) setTimeout(()=>input.focus(), 50);
    }

    function closeAddModal(){
      if(!addModal) return;
      addModal.classList.remove("visible");
      addModal.setAttribute("aria-hidden", "true");
    }

    if(openModalBtn) openModalBtn.addEventListener("click", openAddModal);
    if(backdrop) backdrop.addEventListener("click", closeAddModal);
    if(closeModalBtn) closeModalBtn.addEventListener("click", closeAddModal);
    if(cancelModalBtn) cancelModalBtn.addEventListener("click", closeAddModal);

    if(submitBtn){
      submitBtn.addEventListener("click", ()=>{
        const kanjiInput = document.getElementById("addKanji");
        const hiraInput = document.getElementById("addHira");
        const meaningInput = document.getElementById("addMeaning");

        if(kanjiInput && hiraInput && meaningInput){
          const kanji = kanjiInput.value.trim();
          const hiragana = hiraInput.value.trim();
          const meaning = meaningInput.value.trim();

          if(kanji && hiragana && meaning){
            addKanjiToCategory(cat.id, kanji, hiragana, meaning);
            kanjiInput.value = "";
            hiraInput.value = "";
            meaningInput.value = "";
            closeAddModal();
            /* addKanjiToCategory reloads CATEGORIES from the database, which
               replaces the set objects — re-read ours so the new word shows. */
            rerenderDetail(week, byId(cat.id) || cat, mode);
          }
        }
      });
    }

    if(mode !== "cards" || cat.words.length === 0) return;

    const flipCard = document.getElementById("flipCard");
    if(flipCard){
      const doFlip = ()=>{
        flashState.flipped = !flashState.flipped;
        flipCard.classList.toggle("flipped", flashState.flipped);
      };
      flipCard.addEventListener("click", doFlip);
      flipCard.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); doFlip(); }});
      flipCard.setAttribute("tabindex","0");
      flipCard.setAttribute("role","button");
      flipCard.setAttribute("aria-label","Flashcard, tap to reveal reading and meaning");
    }

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    if(prevBtn) prevBtn.addEventListener("click", ()=>{
      if(flashState.index > 0){ flashState.index--; flashState.flipped=false; rerenderDetail(week,cat,"cards"); }
    });
    if(nextBtn) nextBtn.addEventListener("click", ()=>{
      if(flashState.index < flashState.order.length-1){ flashState.index++; flashState.flipped=false; rerenderDetail(week,cat,"cards"); }
    });

    const shuffleBtn = document.getElementById("shuffleBtn");
    if(shuffleBtn) shuffleBtn.addEventListener("click", ()=>{
      startFlash(cat.id, true);
      rerenderDetail(week,cat,"cards");
    });
    const resetBtn = document.getElementById("resetBtn");
    if(resetBtn) resetBtn.addEventListener("click", ()=>{
      startFlash(cat.id, false);
      rerenderDetail(week,cat,"cards");
    });
  }

  function rerenderDetail(week, cat, mode){
    const app = document.getElementById("app");
    app.innerHTML = renderCategoryDetail(week, cat, mode);
    bindTopNav();
    bindCategoryDetail(week, cat, mode);
  }

})();
</script>
</body>
</html>
